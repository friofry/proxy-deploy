# Stands in for market-proxy's nginx-proxy/auth.conf while MARKET_ANY_BASIC_AUTH=1.
#
# A request passes with ANY basic auth name and password, or with a puzzle JWT
# as before. A request without credentials is still a 401. It is for a host
# that has to serve clients whose basic auth pair it does not have; the data
# behind it is then as good as public.
#
# The token check is the same /_auth_token the original asks through
# auth_request; it is asked from Lua here because nginx has no access rule that
# says "any basic auth pair".
access_by_lua_block {
    local authorization = ngx.var.http_authorization or ""
    if authorization:lower():find("^basic%s+%S") then
        return
    end

    local res = ngx.location.capture("/_auth_token")
    -- how much of the token's request limit is left, as the original sends it
    ngx.header["X-RateLimit-Limit"] = res.header["X-RateLimit-Limit"]
    ngx.header["X-RateLimit-Remaining"] = res.header["X-RateLimit-Remaining"]
    if res.status == ngx.HTTP_OK then
        return
    end
    if res.status >= 500 then
        return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
    end
    ngx.header["WWW-Authenticate"] = 'Basic realm="Restricted Access"'
    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
}
